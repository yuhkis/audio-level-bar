name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm Apple Silicon toolchain and SDK
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          # Tap attribution reads CATapDescription.bundleIDs, which the macOS 26
          # SDK introduced. An older SDK fails deep in the build log with a
          # missing-member error that looks nothing like a toolchain problem, so
          # check the version here and say why. The Xcode path is deliberately
          # not pinned: pinning it to a version that cannot compile the source
          # breaks the workflow in a way the error message does not explain.
          sdk_version=$(xcrun --show-sdk-version)
          echo "macOS SDK: $sdk_version"
          if [ "${sdk_version%%.*}" -lt 26 ]; then
            echo "::error::The macOS 26 SDK or later is required (found $sdk_version)"
            exit 1
          fi
      - name: Verify source, tests, and app bundle
        run: make ci
